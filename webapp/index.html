<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Reels</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  .overlay {
    position: fixed; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.hidden { display: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="/webapp/static/style.css" />
<!-- defer: don't block HTML parsing/first paint on a third-party network
     round trip — app.js (also effectively deferred by being at the end of
     body) still runs after this, in order, once both are loaded. -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
  <div id="feed" class="feed"></div>

  <div id="loading" class="overlay">
    <div class="spinner"></div>
  </div>

  <div id="unavailable" class="overlay hidden">
    <div class="popup">
      <div class="popup-icon">⚠️</div>
      <div class="popup-title">Temporary Problem</div>
      <div class="popup-text" id="unavailable-text">
        We're experiencing a temporary issue loading reels. Please check back in a bit!
      </div>
      <button id="retry-btn" class="popup-btn">Retry</button>
    </div>
  </div>

  <div id="verify-overlay" class="overlay hidden">
    <div class="popup">
      <div class="popup-icon">🔒</div>
      <div class="popup-title">Verification Required</div>
      <div class="popup-text">
        You've watched your free reels for now. Verify to keep watching unlimited reels.
      </div>
      <button id="verify-btn" class="popup-btn">♻️ Verify</button>
      <button id="verify-howto-btn" class="popup-btn popup-btn-secondary">❓ How to verify</button>
    </div>
  </div>

  <div id="verified-toast" class="toast hidden">✅ Verified! Enjoy unlimited reels.</div>

  <script src="/webapp/static/app.js" defer></script>
</body>
</html>
